services:
  postgres:
    image: postgres:16-alpine
    container_name: chirp-postgres
    restart: always
    environment:
      POSTGRES_DB: chirp_db
      POSTGRES_USER: chirp
      POSTGRES_PASSWORD: chirp_secure_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chirp -d chirp_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: chirp-backend
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      APP_ENV: production
      DEBUG: "false"
      TIMEZONE: Africa/Lagos
      DATABASE_URL: postgresql+asyncpg://chirp:chirp_secure_password@postgres:5432/chirp_db
      WHATSAPP_GATEWAY_URL: http://gateway:3000
      WHATSAPP_GATEWAY_SECRET: chirp-shared-gateway-secret-key-12345
      BACKEND_HOST: 0.0.0.0
      BACKEND_PORT: 8000
      CLASS_GROUP_JID: ${CLASS_GROUP_JID:-120363028392039203@g.us}
      INITIAL_ADMIN_JIDS: ${INITIAL_ADMIN_JIDS:-2348000000000@s.whatsapp.net}
      STORAGE_PROVIDER: ${STORAGE_PROVIDER:-local}
      AI_PROVIDER: ${AI_PROVIDER:-gemini}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-gemini-1.5-flash}
      DEFAULT_REMINDER_HOURS: 24
      WEEKLY_DIGEST_DAY: sunday
      WEEKLY_DIGEST_TIME: "17:00"
    ports:
      - "8000:8000"
    volumes:
      - chirp_uploads:/app/uploads

  gateway:
    build:
      context: .
      dockerfile: whatsapp-gateway/Dockerfile
    container_name: chirp-gateway
    restart: always
    depends_on:
      - backend
    environment:
      GATEWAY_PORT: 3000
      BACKEND_WEBHOOK_URL: http://backend:8000/api/v1/webhook/whatsapp
      WHATSAPP_GATEWAY_SECRET: chirp-shared-gateway-secret-key-12345
      AUTO_CONNECT_WHATSAPP: "true"
    ports:
      - "3000:3000"
    volumes:
      - whatsapp_auth:/app/auth_info_baileys

volumes:
  postgres_data:
  chirp_uploads:
  whatsapp_auth:
